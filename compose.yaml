services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${DSH_SERVER_HOST:-127.0.0.1}:${DSH_SERVER_PORT:-8080}:8080"
    environment:
      DSH_SERVER_ACCOUNT: ${DSH_SERVER_ACCOUNT:?Set DSH_SERVER_ACCOUNT in .env}
      DSH_SERVER_PASSWORD: ${DSH_SERVER_PASSWORD:?Set DSH_SERVER_PASSWORD in .env}
      DSH_SERVER_PUBLIC_URL: ${DSH_SERVER_PUBLIC_URL:-http://localhost:8080}
      # WebRTC data plane: LAN -> P2P -> TURN -> Relay. 0 keeps Relay only.
      DSH_SERVER_WEBRTC: ${DSH_SERVER_WEBRTC:-1}
      DSH_SERVER_STUN_URLS: "${DSH_SERVER_STUN_URLS:-stun:stun.miwifi.com:3478,stun:stun.cloudflare.com:3478}"
      # Probes the STUN endpoints at startup and tries the fastest reachable one first.
      DSH_SERVER_STUN_PROBE: ${DSH_SERVER_STUN_PROBE:-1}
      DSH_SERVER_TURN_URLS: ${DSH_SERVER_TURN_URLS:-}
      DSH_SERVER_TURN_SECRET: ${DSH_SERVER_TURN_SECRET:-}
      DSH_SERVER_TURN_TTL: ${DSH_SERVER_TURN_TTL:-3600}
    volumes:
      - server-data:/data
    restart: unless-stopped
    init: true

  # Optional TURN server, started only with `docker compose --profile turn up -d`.
  # TURN needs host networking (its relay port range cannot be published reliably),
  # so this profile is limited to Linux hosts; use a bare-metal coturn elsewhere.
  coturn:
    image: coturn/coturn:4.6.2
    profiles: ["turn"]
    network_mode: host
    command:
      - --no-cli
      - --log-file=stdout
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=${DSH_SERVER_TURN_SECRET:?Set DSH_SERVER_TURN_SECRET in .env}
      - --realm=${DSH_SERVER_TURN_REALM:-ds-harness-remote}
      - --fingerprint
      - --no-multicast-peers
      - --min-port=49160
      - --max-port=49200
      # Behind 1:1 NAT (cloud VM) also add: --external-ip=<public-ip>/<private-ip>
    restart: unless-stopped

volumes:
  server-data:
